name: CI Pipeline
  
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  
jobs:
  CI:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Verify Node.js Version
        run: node -v
        
      - name: Install Dependencies
        run: npm install
        
      - name: Run Linter
        run: npm run lint
         
      - name: Run Unit Tests
        run: npm test -- --coverage || true
        
      - name: Build and Push Docker Image to Harbor
        env:
          HARBOR_URL: 3.87.83.175
          HARBOR_PROJECT: react-app
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # Create a short tag from commit SHA
          TAG="${GITHUB_SHA::4}"
          
          # First build the local image
          LOCAL_IMAGE="simple-react-app:${TAG}"
          echo "Building image: ${LOCAL_IMAGE}"
          docker build -t ${LOCAL_IMAGE} .
          
          # Create certificate directory for Harbor
          sudo mkdir -p /etc/docker/certs.d/${HARBOR_URL}
          
          # Download and set Harbor's certificate
          echo "${{ secrets.HARBOR_CERT }}" | sudo tee /etc/docker/certs.d/${HARBOR_URL}/ca.crt > /dev/null
          
          # Restart Docker to apply certificate changes
          sudo systemctl restart docker || sudo service docker restart
          sleep 5  # Wait for Docker to restart
          
          # Login to Harbor registry
          echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_URL} -u "${HARBOR_USERNAME}" --password-stdin
          
          # Tag and push with SHA tag
          HARBOR_IMAGE="${HARBOR_URL}/${HARBOR_PROJECT}/simple-react-app:${TAG}"
          docker tag ${LOCAL_IMAGE} ${HARBOR_IMAGE}
          docker push ${HARBOR_IMAGE}
          
          # Tag and push latest version as well
          HARBOR_LATEST="${HARBOR_URL}/${HARBOR_PROJECT}/simple-react-app:latest"
          docker tag ${LOCAL_IMAGE} ${HARBOR_LATEST}
          docker push ${HARBOR_LATEST}
          
          echo "Successfully pushed images to Harbor registry at ${HARBOR_URL}/${HARBOR_PROJECT}"
