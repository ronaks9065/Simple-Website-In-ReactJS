name: CI Pipeline
  
on: 
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  
jobs:
  CI:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Verify Node.js Version
        run: node -v
        
      - name: Install Dependencies
        run: npm install
        
      - name: Run Linter
        run: npm run lint
         
      - name: Run Unit Tests
        run: npm test -- --coverage || true
        
      - name: Build and Push Docker Image to Harbor
        env:
          HARBOR_URL: 3.87.83.175
          HARBOR_PROJECT: react-app
          HARBOR_USERNAME: admin
          HARBOR_PASSWORD: admin123
          HARBOR_CERT: ${{ secrets.HARBOR_CERT }}
        run: |
          TAG="${GITHUB_SHA::4}"
          LOCAL_IMAGE="simple-react-app:${TAG}"
          echo "Building image: ${LOCAL_IMAGE}"
          docker build -t ${LOCAL_IMAGE} .
      
          # Create directory for Harbor cert
          sudo mkdir -p /etc/docker/certs.d/${HARBOR_URL}
      
          # Write Harbor certificate
          echo "$HARBOR_CERT" | sudo tee /etc/docker/certs.d/${HARBOR_URL}/ca.crt > /dev/null
      
          # Restart Docker to pick up the certificate
          sudo systemctl restart docker || sudo service docker restart
          sleep 5
      
          # Docker login and push
          echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_URL} -u "${HARBOR_USERNAME}" --password-stdin
      
          HARBOR_IMAGE="${HARBOR_URL}/${HARBOR_PROJECT}/simple-react-app:${TAG}"
          docker tag ${LOCAL_IMAGE} ${HARBOR_IMAGE}
          docker push ${HARBOR_IMAGE}
      
          HARBOR_LATEST="${HARBOR_URL}/${HARBOR_PROJECT}/simple-react-app:latest"
          docker tag ${LOCAL_IMAGE} ${HARBOR_LATEST}
          docker push ${HARBOR_LATEST}
      
          echo "Successfully pushed images to Harbor at ${HARBOR_URL}/${HARBOR_PROJECT}"
      
